<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>My Orders | Poultry Shop</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================
       CSS RESET & FRESH GREEN THEME
       ========================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg-main: #f8fafc;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-light: #94a3b8;
      
      --primary-green: #10b981;
      --primary-dark: #047857;
      --primary-deep: #064e3b;
      --green-light: #ecfdf5;
      --green-border: rgba(16, 185, 129, 0.2);
      
      --gold-accent: #d97706;
      --gold-light: #fef3c7;
      --danger: #ef4444;
      --danger-light: #fef2f2;
      
      /* Status Colors */
      --st-pending: #f59e0b;
      --st-accepted: #3b82f6;
      --st-preparing: #8b5cf6;
      --st-ontheway: #06b6d4;
      --st-delivered: #10b981;
      --st-rejected: #ef4444;
      --st-cancelled: #64748b;
      
      --border-subtle: #e2e8f0;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
      --shadow-md: 0 4px 14px rgba(0,0,0,0.08);
      
      --bottom-nav-height: 64px;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: calc(var(--bottom-nav-height) + 26px);
      overflow-x: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* Top Sticky Header */
    .top-header {
      background: #ffffff;
      border-bottom: 1px solid var(--border-subtle);
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-sm);
      padding: 10px 16px;
    }

    .header-content {
      max-width: 520px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-center {
      text-align: center;
      flex: 1;
    }

    .shop-logo-frame {
      width: 40px;
      height: 40px;
      margin: 0 auto 2px auto;
      border-radius: 12px;
      background: var(--green-light);
      border: 1.5px solid var(--primary-green);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .shop-logo-frame img { width: 100%; height: 100%; object-fit: cover; }
    .shop-logo-frame svg { width: 22px; height: 22px; stroke: var(--primary-green); }

    .shop-name-title {
      font-family: 'Cinzel', serif;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--primary-deep);
      line-height: 1.2;
    }

    .btn-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--bg-main);
      border: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
      cursor: pointer;
      position: relative;
      text-decoration: none;
    }

    .badge-count {
      position: absolute;
      top: -2px;
      right: -2px;
      background: var(--danger);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 10px;
      border: 2px solid #fff;
    }

    /* Page Title Bar */
    .page-title-row {
      margin: 16px 0 12px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .page-title-row h2 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
    }

    /* Order Status Filter Tabs */
    .filter-tabs-scroller {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 16px;
      scrollbar-width: none;
    }
    .filter-tabs-scroller::-webkit-scrollbar { display: none; }

    .tab-pill {
      background: #ffffff;
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 7px 16px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-pill.active {
      background: var(--primary-green);
      color: #ffffff;
      border-color: var(--primary-green);
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.25);
    }

    /* Order Cards List */
    .orders-list-wrap {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .order-card {
      background: #ffffff;
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      padding: 16px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      position: relative;
      transition: transform 0.2s ease;
    }

    .order-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }

    .order-id-label {
      font-family: 'Cinzel', serif;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--primary-deep);
    }

    /* Status Badges */
    .status-badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .badge-pending { background: rgba(245, 158, 11, 0.15); color: #b45309; border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-accepted { background: rgba(59, 130, 246, 0.15); color: #1d4ed8; border: 1px solid rgba(59, 130, 246, 0.3); }
    .badge-preparing { background: rgba(139, 92, 246, 0.15); color: #6d28d9; border: 1px solid rgba(139, 92, 246, 0.3); }
    .badge-ontheway { background: rgba(6, 182, 212, 0.15); color: #0e7490; border: 1px solid rgba(6, 182, 212, 0.3); }
    .badge-delivered, .badge-completed { background: var(--green-light); color: var(--primary-dark); border: 1px solid var(--green-border); }
    .badge-rejected, .badge-cancelled { background: var(--danger-light); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.25); }

    /* Live Countdown Box */
    .delivery-countdown-box {
      background: var(--gold-light);
      border: 1px dashed rgba(217, 119, 6, 0.3);
      border-radius: 10px;
      padding: 8px 12px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.76rem;
      color: var(--gold-accent);
    }

    .countdown-timer-val {
      font-family: monospace;
      font-weight: 800;
      font-size: 0.88rem;
    }

    /* Item Summary & Meta */
    .order-meta-info {
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 10px;
    }

    .order-meta-info p {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 3px;
    }

    .order-meta-info svg {
      width: 14px;
      height: 14px;
      stroke: var(--primary-green);
      flex-shrink: 0;
    }

    .order-pricing-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      border-top: 1px dashed var(--border-subtle);
      padding-top: 10px;
      margin-top: 6px;
      margin-bottom: 12px;
    }

    .total-amount-display {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--primary-deep);
    }

    /* Actions Bar */
    .order-card-actions {
      display: flex;
      gap: 8px;
    }

    .btn-view-details {
      flex: 1;
      height: 38px;
      background: var(--primary-green);
      color: #ffffff;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 700;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s ease;
    }

    .btn-view-details:hover { background: var(--primary-dark); }

    .btn-cancel-order {
      padding: 0 12px;
      height: 38px;
      background: var(--danger-light);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: var(--danger);
      border-radius: 10px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .btn-cancel-order:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Empty States */
    .empty-orders-wrap {
      text-align: center;
      padding: 60px 16px;
      background: #ffffff;
      border: 1px dashed var(--border-subtle);
      border-radius: 24px;
      margin: 20px 0;
      display: none;
    }

    .empty-orders-icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--green-light);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px auto;
      color: var(--primary-green);
    }

    .empty-orders-icon svg { width: 36px; height: 36px; }

    .btn-browse-shop {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--primary-green);
      color: #ffffff;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 700;
      margin-top: 14px;
    }

    /* Fixed Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--bottom-nav-height);
      background: #ffffff;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 100;
      box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.05);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.68rem;
      font-weight: 600;
      gap: 3px;
      flex: 1;
      height: 100%;
      position: relative;
    }

    .nav-item svg { width: 20px; height: 20px; stroke: currentColor; }
    .nav-item.active { color: var(--primary-dark); }
    .nav-item.active svg { stroke: var(--primary-dark); }
  </style>
</head>
